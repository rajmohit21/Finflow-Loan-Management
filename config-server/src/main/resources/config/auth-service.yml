server:
  port: 8081
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /auth/v3/api-docs
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:mohitraj2180@gmail.com}
    password: ${SMTP_PASSWORD:umvljhydryhynpqu}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://${EUREKA_HOST:localhost}:8761/eureka/}
jwt:
  secret: ${JWT_SECRET:aVeryLongSecretKeyForJwtValidationWhichMustBeAtLeast256BitsLong}
  expiration: 86400000

