server:
  port: 8083
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /documents/v3/api-docs
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/document_db?createDatabaseIfNotExist=true
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: admin
    password: admin
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
