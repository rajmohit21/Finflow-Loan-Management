server:
  port: 8084
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /admin/v3/api-docs
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:admin_db}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
