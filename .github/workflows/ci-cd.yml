name: FinFlow CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package -DskipTests
    - name: Run Tests
      run: mvn test

  frontend-quality:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./finflow-frontend
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './finflow-frontend/package-lock.json'
    - name: Install Dependencies
      run: npm ci
    - name: Lint Frontend
      run: npm run lint --if-present
    - name: Build Frontend
      run: npm run build --configuration production

  docker-orchestration:
    name: Dockerize & Validate
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker Stack
      run: docker-compose build
    - name: Verify Configurations
      run: |
        docker-compose config --quiet
        echo "Docker stack validated successfully."
