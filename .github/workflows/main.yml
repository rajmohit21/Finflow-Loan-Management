name: FinFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml -DskipTests

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'finflow-frontend/package-lock.json'
    - name: Install dependencies
      run: npm ci
      working-directory: finflow-frontend
    - name: Build Angular App
      run: npm run build
      working-directory: finflow-frontend

  docker-push:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: actions/setup-docker-action@v2
    # Placeholder for Docker login and push logic
    - name: Build Docker Images
      run: |
        docker build -t finflow/auth-service:latest ./auth-service
        docker build -t finflow/application-service:latest ./application-service
        docker build -t finflow/api-gateway:latest ./api-gateway
